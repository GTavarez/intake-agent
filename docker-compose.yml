services:
  db:
    image: postgres:16-alpine
    container_name: intake-db
    environment:
      POSTGRES_USER: intake
      POSTGRES_PASSWORD: intake
      POSTGRES_DB: intake
    ports:
      # 5433 on the host so this never fights a Postgres you already run.
      - "5433:5432"
    volumes:
      - intake-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intake -d intake"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  intake-pgdata:
